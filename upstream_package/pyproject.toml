[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tes-evidence-codesign"
version = "16.0.0"
description = "Validated evidence-gated multiscale co-design of molten-salt packed-bed thermal-storage systems"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "scipy>=1.12,<2",
  "numba>=0.60,<1",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.9,<4", "Pillow>=11,<13"]

[project.scripts]
tespub = "tespub.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
